<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Firmus Electronics – Barlow Cabana</title>
<style>
:root {
  --bg: #0c0c0c;
  --bar: #141414;
  --card: #1c1c1c;
  --card-2: #222;
  --border: rgba(255,255,255,.12);
  --text: #eee;
  --muted: #9b9b9b;
  --faint: #6e6e6e;
  --accent: #03a9f4;
  --accent-dim: rgba(3,169,244,.16);
  --light: #ffc107;
  --heat: #ff6d00;
  --danger: #ef5350;
  --ok: #66bb6a;
  --track: #3a3a3a;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(0,0,0,.45);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--text); }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  min-height: 100dvh;
  padding-bottom: var(--safe-bot);
}
button, input, select { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; }
a { color: var(--accent); }
/* Header */
.top {
  position: sticky; top: 0; z-index: 20;
  background: var(--bar);
  border-bottom: 1px solid var(--border);
  padding: calc(8px + var(--safe-top)) 14px 10px;
}
.top-inner {
  max-width: 1100px; margin: 0 auto;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
}
.top img { height: 28px; width: auto; display: block; }
.brand { flex: 1 1 200px; min-width: 0; }
.brand h1 { font-size: 14px; font-weight: 650; letter-spacing: .01em; line-height: 1.3; }
.brand p { font-size: 11px; color: var(--muted); margin-top: 1px; }
.top-actions { display: flex; align-items: center; gap: 10px; margin-left: auto; }
.badge {
  flex-shrink: 0;
  font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  color: #ffccbc; background: #3e2723; border: 1px solid #5d4037;
  border-radius: 999px; padding: 5px 9px; white-space: nowrap;
}
.reset {
  flex-shrink: 0; font-size: 12px; color: var(--muted); text-decoration: none;
  border-bottom: 1px dotted var(--faint);
}
.reset:hover { color: var(--text); }
@media (max-width: 639px) {
  .top-actions { flex: 1 1 100%; justify-content: space-between; margin-left: 0; }
}
/* App */
.app { max-width: 1100px; margin: 0 auto; padding: 14px 12px 28px; }
@media (min-width: 720px) { .app { padding: 20px 20px 40px; } }
.view-enter { animation: fadeUp .28s ease; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.scene-flash { animation: flash .55s ease; }
@keyframes flash { 0% { filter: brightness(1); } 35% { filter: brightness(1.18); } 100% { filter: brightness(1); } }

.heading { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; margin: 6px 2px 10px; }
.heading.sub { font-size: 13px; font-weight: 550; color: #ddd; margin-top: 16px; }
.kicker { font-size: 12px; color: var(--muted); margin: -4px 2px 12px; }

/* Scenes */
.scenes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
@media (min-width: 720px) { .scenes { grid-template-columns: repeat(4, 1fr); gap: 12px; } }
.scene {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); min-height: 96px; padding: 14px 8px 12px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  transition: border-color .15s, background .15s, transform .12s;
}
.scene:active { transform: scale(.98); }
.scene .ico { font-size: 26px; line-height: 1; }
.scene .name { font-size: 13px; font-weight: 600; }
.scene.active { border-color: var(--accent); background: var(--accent-dim); }
.scene.alloff .ico { color: var(--danger); }
.scene.heatup .ico { color: var(--heat); }

/* Tiles */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (min-width: 720px) { .tiles { grid-template-columns: repeat(3, 1fr); gap: 12px; } }
.tile-btn {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); min-height: 132px; padding: 16px 14px 14px; text-align: left;
  display: flex; flex-direction: column; gap: 6px;
  transition: border-color .15s, transform .12s;
}
.tile-btn:active { transform: scale(.98); }
.tile-btn .dot {
  width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  background: #2a2a2a; font-size: 22px; margin-bottom: 4px;
}
.tile-btn.on .dot { background: var(--accent-dim); }
.tile-btn.heat-on .dot { background: rgba(255,109,0,.2); }
.tile-btn.light-on .dot { background: rgba(255,193,7,.18); }
.tile-btn .name { font-size: 16px; font-weight: 600; }
.tile-btn .st { font-size: 13px; color: var(--muted); }
.tile-btn .hint { font-size: 11px; color: var(--faint); margin-top: auto; }

/* Back */
.back {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--card); border: 1px solid var(--border); border-radius: 999px;
  padding: 8px 14px; font-size: 13px; font-weight: 600; margin-bottom: 12px;
}
.back:active { background: var(--card-2); }

/* Cards */
.card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 12px 14px; margin-bottom: 10px;
}
.row { display: flex; align-items: center; gap: 12px; }
.sw { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #2a2a2a; font-size: 18px; flex-shrink: 0; }
.sw.on.light { background: rgba(255,193,7,.18); }
.sw.on.heat { background: rgba(255,109,0,.2); }
.sw.on.cool { background: var(--accent-dim); }
.meta { flex: 1; min-width: 0; }
.meta .n { font-size: 14px; font-weight: 600; }
.meta .e { font-size: 10px; color: var(--faint); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; margin-top: 1px; }
.meta .s { font-size: 13px; color: var(--muted); margin-top: 1px; }
.tog {
  width: 44px; height: 26px; border-radius: 13px; background: #3a3a3a; position: relative; flex-shrink: 0;
  transition: background .15s;
}
.tog::after { content: ""; width: 20px; height: 20px; border-radius: 50%; background: #fff; position: absolute; top: 3px; left: 3px; transition: left .15s; }
.tog.on { background: var(--accent); }
.tog.on::after { left: 21px; }
.tog.heat.on { background: var(--heat); }

/* Sliders */
.slider { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.slider input[type=range] { flex: 1; -webkit-appearance: none; appearance: none; height: 4px; background: var(--track); border-radius: 4px; outline: none; }
.slider input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.5); cursor: pointer; }
.slider .pct { width: 42px; text-align: right; font-size: 12px; color: var(--muted); }
.bri-fill-light::-webkit-slider-runnable-track, .slider input.warm { }
.ct-range { flex: 1; -webkit-appearance: none; appearance: none; height: 6px; border-radius: 4px; outline: none;
  background: linear-gradient(90deg, #ffb74d 0%, #fff4d6 45%, #e3f2fd 75%, #90caf9 100%); }

/* Buttons / chips */
.btns { display: grid; gap: 8px; margin-top: 8px; }
.btns.c2 { grid-template-columns: 1fr 1fr; }
.btns.c3 { grid-template-columns: 1fr 1fr 1fr; }
.btns.c4 { grid-template-columns: 1fr 1fr 1fr 1fr; }
.chip {
  background: #2a2a2a; border: 1px solid var(--border); border-radius: 10px;
  padding: 10px 8px; font-size: 12px; font-weight: 600; text-align: center;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; min-height: 52px;
}
.chip.active { border-color: var(--accent); background: var(--accent-dim); }
.chip.danger { color: #ffcdd2; }
.dotc { width: 14px; height: 14px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(255,255,255,.25), 0 0 0 1px rgba(0,0,0,.35); }

/* Color wheel */
.wheel-wrap { display: flex; flex-direction: column; align-items: center; padding: 8px 0 4px; }
.wheel {
  width: 150px; height: 150px; border-radius: 50%; position: relative; touch-action: none; cursor: pointer;
  background: conic-gradient(#ff0000, #ff9900, #ffee00, #33dd33, #00e5ff, #2266ff, #aa00ff, #ff0000);
  box-shadow: 0 0 0 3px #2a2a2a, inset 0 0 0 36px var(--card);
}
.wheel .hub {
  position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px;
  border-radius: 50%; box-shadow: inset 0 0 0 2px rgba(255,255,255,.3), 0 1px 4px rgba(0,0,0,.45);
  pointer-events: none;
}
.wheel .handle {
  position: absolute; width: 16px; height: 16px; border-radius: 50%; background: #fff;
  border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.5); transform: translate(-50%,-50%);
  pointer-events: none;
}
.note { font-size: 11px; color: var(--muted); line-height: 1.45; padding: 8px 12px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); margin: 8px 0; }
.grid2 { display: grid; gap: 10px; }
@media (min-width: 720px) { .grid2.two { grid-template-columns: 1fr 1fr; } .span2 { grid-column: 1 / -1; } }

/* Thermostat */
.thermo { display: flex; align-items: center; gap: 16px; }
.dial { width: 92px; height: 92px; border-radius: 50%; border: 6px solid #2a2a2a; border-top-color: var(--heat);
  display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0; }
.dial .big { font-size: 22px; font-weight: 700; }
.dial .sm { font-size: 10px; color: var(--muted); }
.stepper { display: flex; gap: 8px; margin-top: 8px; }
.stepper button {
  width: 44px; height: 44px; border-radius: 10px; background: #2a2a2a; border: 1px solid var(--border);
  font-size: 22px; font-weight: 600;
}

/* Toast */
.toast {
  position: fixed; left: 50%; bottom: calc(20px + var(--safe-bot)); transform: translateX(-50%) translateY(12px);
  background: #1a1a1a; border: 1px solid var(--border); color: var(--text);
  border-radius: 999px; padding: 10px 16px; font-size: 13px; font-weight: 600;
  box-shadow: 0 8px 24px rgba(0,0,0,.45); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  z-index: 50; max-width: calc(100% - 32px); text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

#autotest-out { display: none; white-space: pre-wrap; font-size: 11px; padding: 12px; }
body.autotest #autotest-out { display: block; background: #111; color: #9f9; margin: 8px; border: 1px solid #333; }
.countdown { font-size: 12px; color: #ffcc80; margin-top: 8px; }
.muted-tag { color: var(--danger); font-weight: 600; }
.footer-note { text-align: center; font-size: 10px; color: var(--faint); margin-top: 18px; }
</style>
</head>

    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("show"); }, 2200);
  }

  function lightsOnCount() {
    let n = 0;
    Object.keys(state.lights).forEach(function (k) { if (state.lights[k].on && state.lights[k].bri > 0) n++; });
    if (state.under.on && state.under.bri > 0) n++;
    return n;
  }
  function heatersOnCount() {
    return [1,2,3].filter(function (i) { return state.heaters[i]; }).length;
  }
  function fanLabel() {
    if (!state.fan.pct) return "Off";
    const spd = state.fan.pct <= 33 ? "Low" : state.fan.pct <= 66 ? "Med" : "High";
    return spd + " · " + state.fan.pct + "% · " + (state.fan.dir === "forward" ? "Forward" : "Reverse");
  }
  function rgbCss(rgb) { return "rgb(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + ")"; }
  function kelvinRgb(k) {
    const t = Math.max(0, Math.min(1, (k - 2200) / (6500 - 2200)));
    const r = 255;
    const g = Math.round(167 + (230 - 167) * t);
    const b = Math.round(77 + (253 - 77) * t);
    return [r, g, b];
  }
  function underColor() {
    return state.under.mode === "ct" ? kelvinRgb(state.under.kelvin) : state.under.rgb;
  }
  function setHeater(id, on) {
    state.heaters[id] = on;
    state.heaterOnAt[id] = on ? Date.now() : null;
    state.lastScene = null;
  }
  function allHeaters(on) {
    [1,2,3].forEach(function (i) { setHeater(i, on); });
  }
  function heaterRemaining() {
    const starts = [1,2,3].filter(function (i) { return state.heaters[i] && state.heaterOnAt[i]; })
      .map(function (i) { return state.heaterOnAt[i]; });
    if (!starts.length) return null;
    return Math.max(0, Math.min.apply(null, starts) + THREE_H - Date.now());
  }
  function fmtRemain(ms) {
    const s = Math.ceil(ms / 1000);
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    return h + "h " + String(m).padStart(2,"0") + "m " + String(sec).padStart(2,"0") + "s";
  }
  function tickHeaters() {
    const rem = heaterRemaining();
    if (rem === 0) {
      allHeaters(false);
      state.lastScene = null;
      save();
      toast("Heaters auto-off after 3 hours");
      render();
      return;
    }
    const el = document.querySelector(".countdown");
    if (el && rem !== null) el.textContent = "Safety auto-off in " + fmtRemain(rem) + " (3-hour timer)";
  }
  function setBeamPlaying(on, auto) {
    state.beam.playing = !!on;
    if (on && !state.grouped) {
      state.grouped = true;
      if (auto !== false) toast("Amps joined the Beam (auto-group)");
    }
  }
  function setTv(on) {
    state.tv.on = !!on;
    if (on) {
      // HDMI-ARC: soundbar starts playing with the TV
      setBeamPlaying(true, true);
    } else {
      state.beam.playing = false;
    }
  }

    entertain: {
      name: "Entertain",
      apply: function () {

        setUnder({ on:true, bri:100, mode:"ct", kelvin:3500 });

        state.pool.light = true; state.pool.mode = "party";
      }
    },
    party: {
      name: "Party",
      apply: function () {
        setLights({ ceiling:100, sconces:90, pendants:80, landscape:100 });
        setUnder({ on:true, bri:100, mode:"rgb", rgb:[160,0,255] });
        state.fan.pct = 80;
        state.grouped = true;
        state.pool.light = true; state.pool.mode = "party";
      }
    },
    dinner: {
      name: "Dinner",
      apply: function () {

    },

      }
    },

  function setLights(map) {
    Object.keys(map).forEach(function (k) {
      const bri = map[k];
      state.lights[k].bri = bri || state.lights[k].bri || 0;
      if (bri === 0) { state.lights[k].on = false; state.lights[k].bri = 0; }
      else { state.lights[k].on = true; state.lights[k].bri = bri; }
    });
  }
  function setUnder(o) {
    if (o.on === false) { state.under.on = false; if (o.bri != null) state.under.bri = o.bri; return; }
    state.under.on = true;
    if (o.bri != null) state.under.bri = o.bri;
    if (o.mode) state.under.mode = o.mode;
    if (o.kelvin != null) { state.under.kelvin = o.kelvin; state.under.mode = "ct"; }
    if (o.rgb) { state.under.rgb = o.rgb; state.under.mode = o.mode || "rgb"; }
  }

  function applyScene(id) {
    const sc = SCENES[id];
    if (!sc) return;
    sc.apply();
    state.lastScene = id;
    save();
    toast(sc.name + " scene applied");
    render({ flash: true });
  }

  function resetDemo(ev) {
    if (ev) ev.preventDefault();
    state = defaults();
    save();
    toast("Demo reset");
    location.hash = "home";
    render();
  }

  /* ---------- views ---------- */
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" })[c]; }); }

  function backBtn() {
    return '<button type="button" class="back" data-action="nav" data-view="home">← Back</button>';

  function tog(on, action, extra) {
    return '<button type="button" class="tog' + (on ? " on" : "") + '" data-action="' + action + '" ' + (extra||"") + ' aria-pressed="' + on + '"></button>';
  }
  function range(action, val, min, max, extra, cls, labelW) {
    return '<div class="slider"><input type="range" min="' + min + '" max="' + max + '" value="' + val + '" data-action="' + action + '" ' + (extra||"") + (cls? ' class="'+cls+'"':'') + '><span class="pct" style="' + (labelW||"") + '">' + val + (cls==="ct-range"? "K":"%") + '</span></div>';
  }

      ["entertain","🍸","Entertain",""],["party","🎉","Party",""],["dinner","🍽️","Dinner",""],["cozy","🌙","Cozy",""],

    ].map(function (s) {

      return '<button type="button" class="scene ' + s[3] + on + '" data-action="scene" data-scene="' + s[0] + '"><div class="ico">' + s[1] + '</div><div class="name">' + s[2] + '</div></button>';

        tile("fan", fanOn?"on":"", "🌀", "Fan", fanLabel(), "Speed and direction") +

  function lightRow(id, name, entity) {
    const L = state.lights[id];

    return '<div class="card">' +
      '<div class="row"><div class="sw ' + (on?"on light":"") + '">💡</div>' +
      '<div class="meta"><div class="n">' + name + '</div><div class="e">' + entity + '</div>' +
      '<div class="s">' + (on ? ("On · " + L.bri + "%") : "Off") + '</div></div>' +
      tog(on, "toggle-light", 'data-id="'+id+'"') + '</div>' +
      range("bri", L.bri, 0, 100, 'data-id="'+id+'"') +
      '</div>';
  }

  function wheelHue() {
    if (state.under.mode === "ct") return 30;
    const rgb = state.under.rgb;
    const r = rgb[0]/255, g = rgb[1]/255, b = rgb[2]/255;
    const max = Math.max(r,g,b), min = Math.min(r,g,b), d = max-min;
    let h = 0;
    if (d) {
      if (max===r) h = ((g-b)/d + (g<b?6:0)) * 60;
      else if (max===g) h = ((b-r)/d + 2) * 60;
      else h = ((r-g)/d + 4) * 60;
    }
    return h;
  }
  function wheelHandlePos() {
    const h = wheelHue();
    const rad = (h - 90) * Math.PI / 180;
    const R = 57; // px from center of 150px wheel, mid-ring
    const cx = 75, cy = 75;
    return { x: cx + R * Math.cos(rad), y: cy + R * Math.sin(rad) };
  }

  function viewLighting() {

      ["purple","Purple","#8e24aa"],["red","Red","#e53935"],["green","Green","#43a047"]
    ].map(function (p) {
      const active = (p[0]==="warm" && u.mode==="ct" && u.kelvin===2700) ||
                     (p[0]==="cool" && u.mode==="ct" && u.kelvin===6500) ||

      return '<button type="button" class="chip'+(active?" active":"")+'" data-action="uc-preset" data-preset="'+p[0]+'"><span class="dotc" style="background:'+p[2]+'"></span>'+p[1]+'</button>';
    }).join("");
    return backBtn() + '<div class="heading">Lighting</div>' +
      '<p class="kicker">Lutron dimmers and the Goodlite RGB+CCT under-counter strip.</p>' +
      lightRow("ceiling","Ceiling","light.cabana_ceiling") +

      lightRow("landscape","Landscape","light.cabana_landscape") +
      '<div class="card">' +
        '<div class="row"><div class="sw '+(on?"on light":"")+'" style="'+(on?"background:"+rgbCss(col)+";color:#111":"")+'">━</div>' +
        '<div class="meta"><div class="n">Under-counter LED</div><div class="e">light.cabana_under_counter</div>' +
        '<div class="s">' + (on ? ("RGB+CCT · On · " + u.bri + "% · " + (u.mode==="ct"? u.kelvin+" K" : "Color")) : "Off") + '</div></div>' +

          '<div class="hub" style="background:'+rgbCss(col)+'"></div>' +
          '<div class="handle" style="left:'+hp.x+'px;top:'+hp.y+'px;background:'+rgbCss(col)+'"></div>' +
        '</div></div>' +
        range("uc-bri", u.bri, 0, 100, "") +
        '<div class="slider"><input type="range" class="ct-range" min="2200" max="6500" step="50" value="'+(u.mode==="ct"?u.kelvin:2700)+'" data-action="uc-kelvin"><span class="pct" style="width:48px">'+(u.mode==="ct"?u.kelvin:"—")+'K</span></div>' +
        '<div class="btns c3" style="margin-top:10px">'+presets+'</div>' +
      '</div>' +
      '<p class="note">Color wheel and RGB presets use rgb color. Warm / Cool white use color temperature (2700 K / 6500 K). In the live home, this strip needs a Milight-compatible bridge or a Wi-Fi controller such as a Shelly RGBW.</p>';
  }

      '<div class="card"><div class="row"><div class="sw '+(p.light?"on light":"")+'">💡</div>' +
      '<div class="meta"><div class="n">Pool light</div><div class="e">light.screenlogic_pool_light</div>' +
      '<div class="s">'+(p.light?("On · IntelliBrite · "+p.mode):"Off")+'</div></div>' +
      tog(p.light, "pool-light") + '</div></div>' +
      '<div class="heading sub">IntelliBrite color mode</div>' +
      '<div class="btns c4">'+modes+'</div>' +
      '<p class="note">Color modes call the ScreenLogic set_color_mode action on the gateway (Party, Romance, Caribbean, American, Sunset, Royal, Blue, Green, Red, White, Magenta).</p>' +
      '<div class="heading sub">Temperatures</div>' +
      '<div class="grid2 two">' +
        tempCard("Pool", "sensor.screenlogic_pool_temperature", p.poolTemp+"°F", "🏊", true) +
        tempCard("Spa", "sensor.screenlogic_spa_temperature", p.spa ? (p.spaTemp+"°F") : "— · Spa off", "♨️", p.spa) +
        tempCard("Air", "sensor.screenlogic_pool_air_temperature", p.airTemp+"°F", "🌡️", true) +
      '</div>' +
      '<div class="heading sub">Heater</div>' +
      '<div class="card"><div class="thermo"><div class="dial"><div class="big">'+p.setpoint+'°</div><div class="sm">Setpoint</div></div>' +
        '<div class="meta"><div class="n">Pool heater</div><div class="e">climate.screenlogic_pool_heater</div>' +
        '<div class="s">Heat · Current '+p.poolTemp+'°F</div>' +
        '<div class="stepper">' +
          '<button type="button" data-action="setpoint" data-delta="-1">−</button>' +
          '<button type="button" data-action="setpoint" data-delta="1">+</button>' +
        '</div></div></div></div>' +
      '<div class="heading sub">Circuits</div>' +
      '<div class="card"><div class="row"><div class="sw '+(p.spa?"on heat":"")+'">♨️</div>' +
      '<div class="meta"><div class="n">Spa</div><div class="e">switch.screenlogic_spa</div><div class="s">'+(p.spa?"On":"Off")+'</div></div>' +
      tog(p.spa, "spa") + '</div></div>' +
      '<div class="card"><div class="row"><div class="sw '+(p.pump?"on cool":"")+'">💧</div>' +
      '<div class="meta"><div class="n">Pool pump</div><div class="e">switch.screenlogic_pool_pump</div>' +
      '<div class="s">'+(p.pump?"On · status only (not toggled from this demo)":"Off")+'</div></div></div></div>' +
      '<p class="note">The pump is shown for status and is not toggled here, so it cannot be turned off by accident. Scenes may turn pool lights on or off; they never stop the pump or spa. All Off does not stop the pump or spa.</p>';
  }
  function tempCard(name, entity, value, emoji, on) {
    return '<div class="card"><div class="row"><div class="sw '+(on?"on cool":"")+'">'+emoji+'</div>' +
      '<div class="meta"><div class="n">'+name+'</div><div class="e">'+entity+'</div><div class="s">'+value+'</div></div></div></div>';
  }

  const VIEWS = { home: viewHome, lighting: viewLighting, heat: viewHeat, fan: viewFan, tv: viewTv, music: viewMusic, pool: viewPool };

  function currentView() {
    const h = (location.hash || "#home").replace(/^#/, "") || "home";
    return VIEWS[h] ? h : "home";
  }

  function render(opts) {
    opts = opts || {};
    const app = document.getElementById("app");
    const view = currentView();
    app.innerHTML = VIEWS[view]();
    app.className = "app view-enter";
    if (opts.flash) {
      app.classList.add("scene-flash");
      setTimeout(function () { app.classList.remove("scene-flash"); }, 600);
    }
    const titles = { home:"Cabana", lighting:"Lighting", heat:"Heat", fan:"Fan", tv:"TV", music:"Music", pool:"Pool / Spa" };
    document.title = "Firmus Electronics – Barlow Cabana" + (view!=="home" ? " · " + titles[view] : "");
  }

  /* ---------- events ---------- */
  function onAction(action, el, ev) {
    const ds = el.dataset || {};
    switch (action) {
      case "nav":
        location.hash = ds.view || "home";
        return;
      case "scene":
        applyScene(ds.scene);
        return;
      case "toggle-light": {
        const L = state.lights[ds.id];
        L.on = !L.on;
        if (L.on && !L.bri) L.bri = 80;
        state.lastScene = null; save(); render(); return;
      }
      case "bri": return; // handled on input
      case "toggle-under":
        state.under.on = !state.under.on;
        if (state.under.on && !state.under.bri) state.under.bri = 80;
        state.lastScene = null; save(); render(); return;
      case "uc-preset": {
        const p = PRESETS[ds.preset];
        if (!p) return;
        state.under.on = true;
        state.under.mode = p.mode;
        if (p.kelvin) state.under.kelvin = p.kelvin;
        if (p.rgb) state.under.rgb = p.rgb.slice();
        if (!state.under.bri) state.under.bri = 100;
        state.lastScene = null; save(); render(); return;
      }
      case "toggle-heater":
        setHeater(+ds.id, !state.heaters[+ds.id]);
        save(); render(); return;
      case "heaters-off":
        allHeaters(false); state.lastScene = null; save(); toast("All heaters off"); render(); return;
      case "fan":
        state.fan.pct = +ds.pct; state.lastScene = null; save(); render(); return;
      case "fan-dir":
        state.fan.dir = ds.dir; state.lastScene = null; save(); render(); return;
      case "tv-power":
        setTv(!state.tv.on); state.lastScene = null; save(); render(); return;
      case "tv-source":
        state.tv.source = ds.source; if (!state.tv.on) setTv(true);
        state.lastScene = null; save(); render(); return;
      case "tv-mute":
        state.tv.mute = !state.tv.mute; state.lastScene = null; save(); render(); return;
      case "beam-play":
        setBeamPlaying(!state.beam.playing, true);
        state.lastScene = null; save(); render(); return;
      case "group":
        state.grouped = true; save(); toast("Speakers grouped to the Beam"); render(); return;
      case "ungroup":
        state.grouped = false; save(); toast("Speakers ungrouped"); render(); return;
      case "pool-light":
        state.pool.light = !state.pool.light; state.lastScene = null; save(); render(); return;
      case "pool-mode":
        state.pool.mode = ds.mode; state.pool.light = true; state.lastScene = null; save(); render(); return;
      case "spa":
        state.pool.spa = !state.pool.spa; state.lastScene = null; save(); render(); return;
      case "setpoint": {
        const next = state.pool.setpoint + (+ds.delta);
        state.pool.setpoint = Math.max(65, Math.min(104, next));
        save(); render(); return;
      }
      default: return;
    }
  }

  function onInput(el) {
    const action = el.dataset.action;
    const val = +el.value;
    const label = el.parentElement && el.parentElement.querySelector(".pct");
    if (action === "bri") {
      const L = state.lights[el.dataset.id];
      L.bri = val; L.on = val > 0; state.lastScene = null; save();
      if (label) label.textContent = val + "%";
      const s = el.closest(".card") && el.closest(".card").querySelector(".s");
      if (s) s.textContent = val > 0 ? ("On · " + val + "%") : "Off";
      return;
    }
    if (action === "uc-bri") {
      state.under.bri = val; state.under.on = val > 0; state.lastScene = null; save();
      if (label) label.textContent = val + "%";
      return;
    }
    if (action === "uc-kelvin") {
      state.under.kelvin = val; state.under.mode = "ct"; state.under.on = true; state.lastScene = null; save();
      if (label) label.textContent = val + "K";
      return;
    }
    if (action === "fan-slider") {
      state.fan.pct = val; state.lastScene = null; save();
      if (label) label.textContent = val + "%";
      return;
    }
    if (action === "tv-vol") {
      state.tv.volume = val; if (val > 0) state.tv.mute = false; state.lastScene = null; save();
      if (label) label.textContent = val + "%";
      return;
    }
    if (action === "beam-vol") {
      state.beam.volume = val; state.lastScene = null; save();
      if (label) label.textContent = val + "%";
      return;
    }
    if (action === "amp-vol") {
      state.amps[+el.dataset.id] = val; state.lastScene = null; save();
      if (label) label.textContent = val + "%";
      return;
    }
    if (action === "master-vol") {
      state.beam.volume = val;
      [1,2,3,4].forEach(function (i) { state.amps[i] = val; });
      state.lastScene = null; save();
      if (label) label.textContent = val + "%";
      // refresh other sliders later on change
      return;
    }
  }

  function hueToRgb(h) {
    const s = 1, l = 0.5;
    const c = (1 - Math.abs(2*l - 1)) * s;
    const hp = h / 60;
    const x = c * (1 - Math.abs(hp % 2 - 1));
    let r=0,g=0,b=0;
    if (hp < 1) { r=c; g=x; }
    else if (hp < 2) { r=x; g=c; }
    else if (hp < 3) { g=c; b=x; }
    else if (hp < 4) { g=x; b=c; }
    else if (hp < 5) { r=x; b=c; }
    else { r=c; b=x; }
    const m = l - c/2;
    return [Math.round((r+m)*255), Math.round((g+m)*255), Math.round((b+m)*255)];
  }
  function onWheel(ev, el) {
    ev.preventDefault();
    const r = el.getBoundingClientRect();
    const pt = ev.touches ? ev.touches[0] : ev;
    const x = pt.clientX - r.left - r.width/2;
    const y = pt.clientY - r.top - r.height/2;
    const dist = Math.sqrt(x*x + y*y);
    if (dist < r.width * 0.18 || dist > r.width * 0.52) return;
    let hue = Math.atan2(x, -y) * 180 / Math.PI;
    if (hue < 0) hue += 360;
    state.under.rgb = hueToRgb(hue);
    state.under.mode = "rgb";
    state.under.on = true;
    if (!state.under.bri) state.under.bri = 100;
    state.lastScene = null;
    save();
    render();
  }

  const app = document.getElementById("app");
  app.addEventListener("click", function (ev) {
    const el = ev.target.closest("[data-action]");
    if (!el) return;
    if (el.dataset.action === "uc-wheel") return;
    if (el.tagName === "INPUT") return;
    onAction(el.dataset.action, el, ev);
  });
  app.addEventListener("input", function (ev) {
    if (ev.target && ev.target.dataset && ev.target.dataset.action) onInput(ev.target);
  });
  app.addEventListener("change", function (ev) {
    if (ev.target && ev.target.dataset && ev.target.dataset.action === "master-vol") render();
    if (ev.target && ev.target.dataset && ev.target.dataset.action === "fan-slider") render();
    if (ev.target && ev.target.dataset && ev.target.dataset.action === "uc-kelvin") render();
    if (ev.target && ev.target.dataset && ev.target.dataset.action === "uc-bri") render();
  });
  let wheelDown = false;
  app.addEventListener("pointerdown", function (ev) {
    const el = ev.target.closest("[data-action=uc-wheel]");
    if (!el) return;
    wheelDown = true;
    try { el.setPointerCapture(ev.pointerId); } catch (e) {}
    onWheel(ev, el);
  });
  app.addEventListener("pointermove", function (ev) {
    if (!wheelDown) return;
    const el = ev.target.closest("[data-action=uc-wheel]") || document.getElementById("color-wheel");
    if (el) onWheel(ev, el);
  });
  app.addEventListener("pointerup", function () { wheelDown = false; });
  app.addEventListener("pointercancel", function () { wheelDown = false; });

  document.getElementById("reset-link").addEventListener("click", resetDemo);
  window.addEventListener("hashchange", function () { render(); });

  setInterval(tickHeaters, 1000);

  /* ---------- autotest ---------- */
  window.__cabanaDemo = { getState: function(){ return state; }, applyScene: applyScene, reset: resetDemo, defaults: defaults };

  function autotest() {
    document.body.classList.add("autotest");
    const errors = [];
    window.addEventListener("error", function (e) { errors.push(String(e.message || e)); });
    window.addEventListener("unhandledrejection", function (e) { errors.push(String(e.reason || e)); });
    const results = [];
    function assert(cond, name) { results.push({ name: name, ok: !!cond }); if (!cond) errors.push("FAIL " + name); }
    try {
      localStorage.removeItem(STORE);
      state = defaults();
      applyScene("entertain");
      assert(state.lights.ceiling.bri === 100 && state.lights.ceiling.on, "entertain ceiling 100");
      assert(state.lights.sconces.bri === 80, "entertain sconces 80");
      assert(state.under.kelvin === 3500 && state.under.on, "entertain under 3500K");
      assert(state.fan.pct === 66, "entertain fan 66");
      assert(state.pool.light && state.pool.mode === "party", "entertain pool party");
      applyScene("party");
      assert(state.under.mode === "rgb" && state.under.rgb[0] === 160, "party under purple");
      assert(state.fan.pct === 80 && state.grouped, "party fan + grouped");
      applyScene("dinner");
      assert(state.lights.ceiling.bri === 40 && state.under.kelvin === 2700 && state.under.bri === 50, "dinner levels");
      applyScene("cozy");
      assert(state.lights.ceiling.bri === 15 && state.under.kelvin === 2200 && state.fan.pct === 33, "cozy levels");
      applyScene("movie");
      assert(state.lights.sconces.on === false && state.tv.on && state.grouped && state.pool.light === false, "movie tv + group + pool off");
      applyScene("swim");
      assert(state.pool.mode === "caribbean" && state.pool.light && state.grouped && state.under.rgb[2] === 255, "swim caribbean + blue LED");
      const hBefore = state.heaters[1];
      applyScene("heatup");
      assert(state.heaters[1] && state.heaters[2] && state.heaters[3], "heat up all on");
      assert(state.heaterOnAt[1], "heat up timer started");
      applyScene("alloff");
      assert(!state.lights.ceiling.on && !state.under.on && !state.heaters[1] && state.fan.pct === 0, "all off lights/heat/fan");
      assert(!state.tv.on && !state.beam.playing && !state.grouped && !state.pool.light, "all off tv/beam/pool light");
      assert(state.pool.pump === true, "all off leaves pump on");
      assert(state.pool.spa === false, "spa remains off");
      // auto-group when beam starts
      state.grouped = false;
      setBeamPlaying(true, false);
      assert(state.grouped && state.beam.playing, "auto-group on play");
    } catch (e) {
      errors.push("exception: " + (e && e.stack || e));
    }
    const ok = results.every(function (r) { return r.ok; }) && errors.length === 0;
    const report = { ok: ok, passed: results.filter(function(r){return r.ok;}).length, total: results.length, results: results, errors: errors };
    document.getElementById("autotest-out").textContent = JSON.stringify(report, null, 2);
    document.title = (ok ? "AUTOTEST_PASS " : "AUTOTEST_FAIL ") + document.title;
    console.log("AUTOTEST", report);
    return report;
  }

  var preload = /[?&]scene=([a-z]+)/.exec(location.search);
  if (preload && SCENES[preload[1]] && !/[?&]autotest=1/.test(location.search)) {
    SCENES[preload[1]].apply();
    state.lastScene = preload[1];
    // Do not persist a preload — only interactive use is saved.
  }
  if (/[?&]autotest=1/.test(location.search)) {
    render();
    setTimeout(autotest, 50);
  } else {
    render();
  }
})();
</script>
</body>
</html>
