<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex, nofollow">
<title>Firmus Electronics – Diaz Residence</title>
<style>
:root {
  --bg: #0c0c0c;
  --bar: #141414;
  --card: #1c1c1c;
  --card-2: #222;
  --border: rgba(255,255,255,.12);
  --text: #eee;
  --muted: #9b9b9b;
  --faint: #6e6e6e;
  --accent: #03a9f4;
  --accent-dim: rgba(3,169,244,.16);
  --light: #ffc107;
  --heat: #ff6d00;
  --danger: #ef5350;
  --ok: #66bb6a;
  --track: #3a3a3a;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(0,0,0,.45);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--text); }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  min-height: 100dvh;
  padding-bottom: var(--safe-bot);
}
button, input, select { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; }
a { color: var(--accent); }
/* Header */
.top {
  position: sticky; top: 0; z-index: 20;
  background: var(--bar);
  border-bottom: 1px solid var(--border);
  padding: calc(8px + var(--safe-top)) 14px 10px;
}
.top-inner {
  max-width: 1100px; margin: 0 auto;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
}
.top img { height: 28px; width: auto; display: block; }
.brand { flex: 1 1 200px; min-width: 0; }
.brand h1 { font-size: 14px; font-weight: 650; letter-spacing: .01em; line-height: 1.3; }
.brand p { font-size: 11px; color: var(--muted); margin-top: 1px; }
.top-actions { display: flex; align-items: center; gap: 10px; margin-left: auto; }
.badge {
  flex-shrink: 0;
  font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  color: #ffccbc; background: #3e2723; border: 1px solid #5d4037;
  border-radius: 999px; padding: 5px 9px; white-space: nowrap;
}
.reset {
  flex-shrink: 0; font-size: 12px; color: var(--muted); text-decoration: none;
  border-bottom: 1px dotted var(--faint);
}
.reset:hover { color: var(--text); }
@media (max-width: 639px) {
  .top-actions { flex: 1 1 100%; justify-content: space-between; margin-left: 0; }
}
/* App */
.app { max-width: 1100px; margin: 0 auto; padding: 14px 12px 28px; }
@media (min-width: 720px) { .app { padding: 20px 20px 40px; } }
.view-enter { animation: fadeUp .28s ease; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.scene-flash { animation: flash .55s ease; }
@keyframes flash { 0% { filter: brightness(1); } 35% { filter: brightness(1.18); } 100% { filter: brightness(1); } }

.heading { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; margin: 6px 2px 10px; }
.heading.sub { font-size: 13px; font-weight: 550; color: #ddd; margin-top: 16px; }
.kicker { font-size: 12px; color: var(--muted); margin: -4px 2px 12px; }

/* Scenes */
.scenes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
@media (min-width: 720px) { .scenes { grid-template-columns: repeat(4, 1fr); gap: 12px; } }
.scene {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); min-height: 96px; padding: 14px 8px 12px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  transition: border-color .15s, background .15s, transform .12s;
}
.scene:active { transform: scale(.98); }
.scene .ico { font-size: 26px; line-height: 1; }
.scene .name { font-size: 13px; font-weight: 600; }
.scene.active { border-color: var(--accent); background: var(--accent-dim); }
.scene.alloff .ico { color: var(--danger); }
.scene.heatup .ico { color: var(--heat); }

/* Tiles */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (min-width: 720px) { .tiles { grid-template-columns: repeat(3, 1fr); gap: 12px; } }
.tile-btn {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); min-height: 132px; padding: 16px 14px 14px; text-align: left;
  display: flex; flex-direction: column; gap: 6px;
  transition: border-color .15s, transform .12s;
}
.tile-btn:active { transform: scale(.98); }
.tile-btn .dot {
  width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  background: #2a2a2a; font-size: 22px; margin-bottom: 4px;
}
.tile-btn.on .dot { background: var(--accent-dim); }
.tile-btn.heat-on .dot { background: rgba(255,109,0,.2); }
.tile-btn.light-on .dot { background: rgba(255,193,7,.18); }
.tile-btn .name { font-size: 16px; font-weight: 600; }
.tile-btn .st { font-size: 13px; color: var(--muted); }
.tile-btn .hint { font-size: 11px; color: var(--faint); margin-top: auto; }

/* Back */
.back {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--card); border: 1px solid var(--border); border-radius: 999px;
  padding: 8px 14px; font-size: 13px; font-weight: 600; margin-bottom: 12px;
}
.back:active { background: var(--card-2); }

/* Cards */
.card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 12px 14px; margin-bottom: 10px;
}
.row { display: flex; align-items: center; gap: 12px; }
.sw { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #2a2a2a; font-size: 18px; flex-shrink: 0; }
.sw.on.light { background: rgba(255,193,7,.18); }
.sw.on.heat { background: rgba(255,109,0,.2); }
.sw.on.cool { background: var(--accent-dim); }
.meta { flex: 1; min-width: 0; }
.meta .n { font-size: 14px; font-weight: 600; }
.meta .e { font-size: 10px; color: var(--faint); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; margin-top: 1px; }
.meta .s { font-size: 13px; color: var(--muted); margin-top: 1px; }
.tog {
  width: 44px; height: 26px; border-radius: 13px; background: #3a3a3a; position: relative; flex-shrink: 0;
  transition: background .15s;
}
.tog::after { content: ""; width: 20px; height: 20px; border-radius: 50%; background: #fff; position: absolute; top: 3px; left: 3px; transition: left .15s; }
.tog.on { background: var(--accent); }
.tog.on::after { left: 21px; }
.tog.heat.on { background: var(--heat); }

/* Sliders */
.slider { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.slider input[type=range] { flex: 1; -webkit-appearance: none; appearance: none; height: 4px; background: var(--track); border-radius: 4px; outline: none; }
.slider input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.5); cursor: pointer; }
.slider .pct { width: 42px; text-align: right; font-size: 12px; color: var(--muted); }
.bri-fill-light::-webkit-slider-runnable-track, .slider input.warm { }
.ct-range { flex: 1; -webkit-appearance: none; appearance: none; height: 6px; border-radius: 4px; outline: none;
  background: linear-gradient(90deg, #ffb74d 0%, #fff4d6 45%, #e3f2fd 75%, #90caf9 100%); }

/* Buttons / chips */
.btns { display: grid; gap: 8px; margin-top: 8px; }
.btns.c2 { grid-template-columns: 1fr 1fr; }
.btns.c3 { grid-template-columns: 1fr 1fr 1fr; }
.btns.c4 { grid-template-columns: 1fr 1fr 1fr 1fr; }
.chip {
  background: #2a2a2a; border: 1px solid var(--border); border-radius: 10px;
  padding: 10px 8px; font-size: 12px; font-weight: 600; text-align: center;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; min-height: 52px;
}
.chip.active { border-color: var(--accent); background: var(--accent-dim); }
.chip.danger { color: #ffcdd2; }
.dotc { width: 14px; height: 14px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(255,255,255,.25), 0 0 0 1px rgba(0,0,0,.35); }

/* Color wheel */
.wheel-wrap { display: flex; flex-direction: column; align-items: center; padding: 8px 0 4px; }
.wheel {
  width: 150px; height: 150px; border-radius: 50%; position: relative; touch-action: none; cursor: pointer;
  background: conic-gradient(#ff0000, #ff9900, #ffee00, #33dd33, #00e5ff, #2266ff, #aa00ff, #ff0000);
  box-shadow: 0 0 0 3px #2a2a2a, inset 0 0 0 36px var(--card);
}
.wheel .hub {
  position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px;
  border-radius: 50%; box-shadow: inset 0 0 0 2px rgba(255,255,255,.3), 0 1px 4px rgba(0,0,0,.45);
  pointer-events: none;
}
.wheel .handle {
  position: absolute; width: 16px; height: 16px; border-radius: 50%; background: #fff;
  border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.5); transform: translate(-50%,-50%);
  pointer-events: none;
}
.note { font-size: 11px; color: var(--muted); line-height: 1.45; padding: 8px 12px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); margin: 8px 0; }
.grid2 { display: grid; gap: 10px; }
@media (min-width: 720px) { .grid2.two { grid-template-columns: 1fr 1fr; } .span2 { grid-column: 1 / -1; } }

/* Thermostat */
.thermo { display: flex; align-items: center; gap: 16px; }
.dial { width: 92px; height: 92px; border-radius: 50%; border: 6px solid #2a2a2a; border-top-color: var(--heat);
  display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0; }
.dial .big { font-size: 22px; font-weight: 700; }
.dial .sm { font-size: 10px; color: var(--muted); }
.stepper { display: flex; gap: 8px; margin-top: 8px; }
.stepper button {
  width: 44px; height: 44px; border-radius: 10px; background: #2a2a2a; border: 1px solid var(--border);
  font-size: 22px; font-weight: 600;
}

/* Toast */
.toast {
  position: fixed; left: 50%; bottom: calc(20px + var(--safe-bot)); transform: translateX(-50%) translateY(12px);
  background: #1a1a1a; border: 1px solid var(--border); color: var(--text);
  border-radius: 999px; padding: 10px 16px; font-size: 13px; font-weight: 600;
  box-shadow: 0 8px 24px rgba(0,0,0,.45); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  z-index: 50; max-width: calc(100% - 32px); text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

#autotest-out { display: none; white-space: pre-wrap; font-size: 11px; padding: 12px; }
body.autotest #autotest-out { display: block; background: #111; color: #9f9; margin: 8px; border: 1px solid #333; }
.countdown { font-size: 12px; color: #ffcc80; margin-top: 8px; }
.muted-tag { color: var(--danger); font-weight: 600; }
.footer-note { text-align: center; font-size: 10px; color: var(--faint); margin-top: 18px; }

/* Diaz home — simple grouping extras on top of Barlow styles */
.status-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 2px 16px; }
.pill {
  background: var(--card); border: 1px solid var(--border); border-radius: 999px;
  padding: 6px 12px; font-size: 12px; color: var(--muted);
}
.pill b { color: var(--text); font-weight: 650; }
.pill.ok b { color: var(--ok); }
.pill.armed b { color: #ef9a9a; }
.pill.heat b { color: #ffcc80; }

.tabs {
  display: flex; gap: 4px; margin: 0 0 16px;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 999px; padding: 4px; width: fit-content;
}
.tab {
  padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight: 600;
  color: var(--muted);
}
.tab.on { background: var(--accent-dim); color: var(--text); }

.scenes.lead { margin-bottom: 8px; }
@media (min-width: 840px) { .scenes.lead { grid-template-columns: repeat(5, 1fr); } }
.scene { min-height: 108px; }
.scene .ico { font-size: 28px; }
.scene.morning .ico { color: var(--light); }
.scene.movie .ico { color: #ce93d8; }
.scene.dinner .ico { color: #ffcc80; }
.scene.goodnight .ico { color: #90caf9; }
.scene.away .ico { color: var(--danger); }

.groups { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 18px; }
@media (max-width: 519px) { .groups { grid-template-columns: 1fr 1fr 1fr; gap: 8px; } }
.group-btn {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); min-height: 92px; padding: 12px 10px 10px; text-align: left;
  display: flex; flex-direction: column; gap: 4px;
  transition: border-color .15s, transform .12s;
}
.group-btn:active { transform: scale(.98); }
.group-btn.on { border-color: rgba(255,193,7,.45); }
.group-btn.music-on { border-color: var(--accent); }
.group-btn .gico { font-size: 22px; line-height: 1; }
.group-btn .name { font-size: 14px; font-weight: 600; }
.group-btn .st { font-size: 12px; color: var(--muted); }

.quick { display: grid; gap: 8px; margin-top: 8px; }
.quick.c3 { grid-template-columns: 1fr 1fr 1fr; }
.quick.c4 { grid-template-columns: 1fr 1fr 1fr 1fr; }

.cam {
  height: 150px; border-radius: 10px; background: #141414;
  display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 6px;
  border: 1px dashed var(--border); color: var(--muted); font-size: 12px; text-align: center; padding: 12px;
}
.cam .big { font-size: 28px; }
.cam .t { font-size: 13px; font-weight: 600; color: var(--text); }

.hwqs {
  font-size: 11px; color: var(--muted); margin: -6px 2px 12px;
}
.hwqs b { color: #ddd; font-weight: 600; }

.shade-track { margin-top: 4px; }
.pos-label { font-size: 12px; color: var(--muted); }

.sys-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--border); }
.sys-row:first-child { border-top: 0; }
.sys-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex-shrink: 0; }
.sys-dot.off { background: var(--danger); }
.sys-row .n { font-size: 14px; font-weight: 600; }
.sys-row .s { font-size: 12px; color: var(--muted); }

.alarm-card .big-status { font-size: 22px; font-weight: 700; margin: 4px 0 2px; }
.alarm-card .safe { font-size: 11px; color: var(--muted); line-height: 1.45; margin-top: 8px; }

.stepper { display: flex; align-items: center; gap: 10px; }
.stepper button {
  width: 40px; height: 40px; border-radius: 50%; background: #2a2a2a; border: 1px solid var(--border);
  font-size: 20px; font-weight: 600;
}
.stepper .val { font-size: 28px; font-weight: 700; min-width: 64px; text-align: center; }

.tiny { font-size: 11px; color: var(--faint); margin-top: 6px; }

</style>

</head>

  const AREAS = [
    { id: "great",   name: "Great Room & Kitchen", emoji: "🛋️", hint: "Lights, shades, music, TV" },

  function defaultLights() {
    const o = {};
    LIGHTS.forEach(function (L) { o[L.id] = { on: false, bri: 80 }; });
    o["kit-recessed"] = { on: true, bri: 60 };
    o["kit-pendants"] = { on: true, bri: 45 };
    o["gr-lamps"] = { on: true, bri: 40 };
    return o;
  }
  function defaultShades() {
    const o = {};
    SHADES.forEach(function (S) { o[S.id] = 70; });
    return o;
  }
  function defaultZones() {
    const o = {};
    ZONES.forEach(function (Z) { o[Z.id] = { playing: false, vol: 25 }; });
    return o;
  }
  function defaultTvs() {
    const o = {};
    TVS.forEach(function (T) { o[T.id] = { on: false, source: "Apple TV" }; });
    return o;
  }

  function defaults() {
    return {
      lastScene: null,
      lights: defaultLights(),
      shades: defaultShades(),
      zones: defaultZones(),
      tvs: defaultTvs(),
      climate: { temp: 72, set: 70, mode: "heat", hum: 38 },
      alarm: "disarmed",
      beds: { master: "awake", guest: "awake" },
      yamaha: { playing: false, vol: 20 },
      ring: "idle"
    };
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORE);
      if (!raw) return defaults();
      const s = Object.assign(defaults(), JSON.parse(raw));
      s.lights = Object.assign(defaultLights(), s.lights);
      s.shades = Object.assign(defaultShades(), s.shades);
      s.zones = Object.assign(defaultZones(), s.zones);
      s.tvs = Object.assign(defaultTvs(), s.tvs);
      s.climate = Object.assign(defaults().climate, s.climate);
      s.beds = Object.assign(defaults().beds, s.beds);
      s.yamaha = Object.assign(defaults().yamaha, s.yamaha);
      return s;
    } catch (e) { return defaults(); }
  }
  function save() { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} }

  let state = load();
  let toastTimer = 0;

  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("show"); }, 2200);
  }

  function lightsList(area) {
    return LIGHTS.filter(function (L) { return !area || L.area === area; });
  }
  function shadesList(area) {
    return SHADES.filter(function (S) { return !area || S.area === area; });
  }
  function zonesList(area) {
    return ZONES.filter(function (Z) { return !area || Z.area === area; });
  }
  function tvsList(area) {
    return TVS.filter(function (T) { return !area || T.area === area; });
  }
  function lightIsOn(id) {
    const L = state.lights[id];
    return !!(L && L.on && L.bri > 0);
  }
  function lightsOnCount(area) {
    return lightsList(area).filter(function (L) { return lightIsOn(L.id); }).length;
  }
  function lightsLabel(area) {
    const n = lightsOnCount(area), t = lightsList(area).length;
    if (!n) return "All off";
    if (n === t) return "All on";
    return n + " of " + t + " on";
  }
  function shadeAvg(area) {
    const list = shadesList(area);
    if (!list.length) return null;
    const sum = list.reduce(function (a, S) { return a + state.shades[S.id]; }, 0);
    return Math.round(sum / list.length);
  }
  function shadeLabel(area) {
    const list = shadesList(area);
    if (!list.length) return "No shades in this group";
    const avg = shadeAvg(area);
    const same = list.every(function (S) { return state.shades[S.id] === state.shades[list[0].id]; });
    if (avg === 100 && same) return "Open";
    if (avg === 0 && same) return "Closed";
    if (same) return avg + "% open";
    return "Mixed · avg " + avg + "%";
  }
  function musicPlayingCount(area) {
    return zonesList(area).filter(function (Z) { return state.zones[Z.id].playing; }).length;
  }
  function musicLabel(area) {
    const n = musicPlayingCount(area);
    if (state.yamaha.playing && (!area || area === "great")) {
      return n ? (n + " Sonos + MusicCast") : "Yamaha MusicCast";
    }
    if (!n) return "Idle";
    return n === 1 ? "1 zone playing" : n + " zones playing";
  }
  function tvsOnCount(area) {
    return tvsList(area).filter(function (T) { return state.tvs[T.id].on; }).length;
  }

  function setLight(id, bri) {
    if (bri === 0) { state.lights[id].on = false; state.lights[id].bri = 0; }
    else { state.lights[id].on = true; state.lights[id].bri = bri; }
  }
  function setLightsAll(bri, area) {
    lightsList(area).forEach(function (L) { setLight(L.id, bri); });
  }
  function setShadesAll(pos, area) {
    shadesList(area).forEach(function (S) { state.shades[S.id] = pos; });
  }
  function stopMusic(area) {
    zonesList(area).forEach(function (Z) { state.zones[Z.id].playing = false; });
    if (!area || area === "great") state.yamaha.playing = false;
  }
  function setMusicVol(area, vol) {
    zonesList(area).forEach(function (Z) { state.zones[Z.id].vol = vol; });
  }
  function setTvs(area, on) {
    tvsList(area).forEach(function (T) { state.tvs[T.id].on = on; });
  }
  function shadeWord(pos) {
    if (pos === 0) return "Closed";
    if (pos === 100) return "Open";
    return pos + "% open";
  }
  function alarmLabel() {
    if (state.alarm === "away") return "Armed Away";
    if (state.alarm === "stay") return "Armed Stay";
    return "Disarmed";
  }

  const SCENES = {

  function applyScene(id) {

  function resetDemo(ev) {
    if (ev) ev.preventDefault();
    state = defaults();
    save();
    toast("Demo reset");
    location.hash = "home";
    render();
  }

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" })[c]; }); }

  function backBtn(view) {
    return '<button type="button" class="back" data-action="nav" data-view="' + (view || "home") + '">← Back</button>';
  }
  function tabs(active) {
    return '<div class="tabs">' +
      '<button type="button" class="tab' + (active==="home"?" on":"") + '" data-action="nav" data-view="home">Home</button>' +
      '<button type="button" class="tab' + (active==="more"?" on":"") + '" data-action="nav" data-view="more">More</button>' +
      '</div>';
  }
  function tog(on, action, extra) {
    return '<button type="button" class="tog' + (on ? " on" : "") + '" data-action="' + action + '" ' + (extra||"") + ' aria-pressed="' + on + '"></button>';
  }
  function range(action, val, extra) {
    return '<div class="slider"><input type="range" min="0" max="100" value="' + val + '" data-action="' + action + '" ' + (extra||"") + '><span class="pct">' + val + '%</span></div>';
  }
  function chipRow(items) {
    return '<div class="btns c' + items.length + '">' + items.map(function (it) {
      return '<button type="button" class="chip' + (it.on?" active":"") + '" data-action="' + it.action + '" ' + (it.extra||"") + '>' + it.label + '</button>';
    }).join("") + '</div>';
  }
  function hwNote() {
    return '<p class="hwqs">Lutron <b>HomeWorks QS</b> · demo circuits by room, not a live programming export.</p>';
  }

  function lightCard(L) {
    const s = state.lights[L.id];
    const on = lightIsOn(L.id);
    return '<div class="card">' +
      '<div class="row">' +
        '<div class="sw' + (on?" on light":"") + '">💡</div>' +
        '<div class="meta"><div class="n">' + esc(L.name) + '</div><div class="s">' + (on ? s.bri + "%" : "Off") + '</div></div>' +
        tog(on, "toggle-light", 'data-id="' + L.id + '"') +
      '</div>' +
      range("bri", on ? s.bri : 0, 'data-id="' + L.id + '"') +
    '</div>';
  }
  function shadeCard(S) {
    const pos = state.shades[S.id];
    return '<div class="card">' +
      '<div class="row">' +
        '<div class="sw' + (pos>0?" on cool":"") + '">🪟</div>' +
        '<div class="meta"><div class="n">' + esc(S.name) + '</div><div class="s pos-label">' + shadeWord(pos) + '</div></div>' +
      '</div>' +
      '<div class="btns c3" style="margin-top:10px">' +
        '<button type="button" class="chip' + (pos===100?" active":"") + '" data-action="shade-set" data-id="' + S.id + '" data-pos="100">Open</button>' +
        '<button type="button" class="chip' + (pos===50?" active":"") + '" data-action="shade-set" data-id="' + S.id + '" data-pos="50">50%</button>' +
        '<button type="button" class="chip' + (pos===0?" active":"") + '" data-action="shade-set" data-id="' + S.id + '" data-pos="0">Close</button>' +
      '</div>' +
      '<div class="shade-track">' + range("shade", pos, 'data-id="' + S.id + '"') + '</div>' +
    '</div>';
  }
  function zoneCard(Z) {
    const s = state.zones[Z.id];

      '<div class="row">' +
        '<div class="sw' + (s.playing?" on cool":"") + '">🔊</div>' +

      '</div>' +
      range("zone-vol", s.vol, 'data-id="' + Z.id + '"') +

  function tvCard(T) {

      '<span class="pill heat">Aprilaire <b>' + state.climate.temp + "° · " + state.climate.set + "° " + state.climate.mode + '</b></span>' +
      '<span class="pill ok">Front door <b>Idle</b></span>' +
      (state.lastScene && SCENES[state.lastScene] ? '<span class="pill">Scene <b>' + SCENES[state.lastScene].name + '</b></span>' : '') +
    '</div>';

  function areaStateLine(id) {
    const bits = [lightsLabel(id)];
    if (shadesList(id).length) bits.push(shadeLabel(id));
    if (zonesList(id).length) bits.push(musicLabel(id));
    const tvn = tvsOnCount(id);
    if (tvsList(id).length) bits.push(tvn ? (tvn + " TV on") : "TV off");
    return bits.join(" · ");
  }

  function viewHome() {

    return tabs("home") +

        '<button type="button" class="group-btn' + (nM?" music-on":"") + '" data-action="nav" data-view="all-music">' +

      '</div>' +

  }

  function lightQuick(area) {
    return chipRow([
      { label: "All Off", action: "lights-preset", extra: 'data-area="' + (area||"") + '" data-bri="0"', on: lightsOnCount(area)===0 },

  function viewArea(id) {

    }

      html += '<div class="heading sub">Shades</div>' + shadeQuick(id) + shades.map(shadeCard).join("");

        '<button type="button" class="tile-btn" data-action="nav" data-view="climate"><div class="dot">🌡️</div><div class="name">Aprilaire</div><div class="st">' + state.climate.temp + "° · set " + state.climate.set + "° · " + mode + '</div><div class="hint">8800-series thermostat (demo)</div></button>' +
        '<button type="button" class="tile-btn" data-action="nav" data-view="alarm"><div class="dot">🔐</div><div class="name">Alarm</div><div class="st">' + alarmLabel() + '</div><div class="hint">Honeywell Lyric · status only</div></button>' +
        '<button type="button" class="tile-btn" data-action="nav" data-view="cameras"><div class="dot">📷</div><div class="name">Cameras</div><div class="st">2 placeholders</div><div class="hint">Hikvision · no live video</div></button>' +
        '<button type="button" class="tile-btn" data-action="nav" data-view="door"><div class="dot">🔔</div><div class="name">Front door</div><div class="st">Ring · Idle</div><div class="hint">Doorbell and chimes</div></button>' +
        '<button type="button" class="tile-btn" data-action="nav" data-view="brilliant"><div class="dot">🖱️</div><div class="name">Brilliant panels</div><div class="st">3 panels · Alexa (one-way)</div><div class="hint">Cannot read on/off state</div></button>' +
        '<button type="button" class="tile-btn" data-action="nav" data-view="network"><div class="dot">📡</div><div class="name">Network</div><div class="st">All UniFi online</div><div class="hint">UDM Pro, switch, 6 APs</div></button>' +
        '<button type="button" class="tile-btn" data-action="nav" data-view="avs"><div class="dot">📺</div><div class="name">TVs &amp; sources</div><div class="st">10 Apple TV · 6 LG · Roku</div><div class="hint">Named rooms plus inventory</div></button>' +
        '<button type="button" class="tile-btn" data-action="nav" data-view="beds"><div class="dot">🛌</div><div class="name">FreshBed</div><div class="st">2 beds (demo)</div><div class="hint">Status only</div></button>' +
      '</div>' +
      '<p class="footer-note">Demo preview. Network names only — no IP addresses, passwords, or alarm codes.</p>';
  }

  function viewClimate() {
    const c = state.climate;
    return backBtn("more") +
      '<div class="heading">Aprilaire thermostat</div>' +
      '<p class="kicker">8800-series Wi-Fi model (demo). Home Assistant can talk to these locally once Automation is turned on in the contractor menu.</p>' +
      '<div class="card"><div class="thermo">' +
        '<div class="dial"><div class="big">' + c.temp + '°</div><div class="s" style="font-size:11px;color:var(--muted)">Indoor</div></div>' +
        '<div>' +
          '<div class="n" style="font-weight:600;margin-bottom:8px">Set to</div>' +
          '<div class="stepper">' +
            '<button type="button" data-action="set-temp" data-delta="-1">−</button>' +
            '<div class="val">' + c.set + '°</div>' +
            '<button type="button" data-action="set-temp" data-delta="1">+</button>' +
          '</div>' +
          '<div class="tiny">Humidity ' + c.hum + '%</div>' +
        '</div>' +
      '</div>' +
      chipRow([
        { label: "Heat", action: "hvac-mode", extra: 'data-mode="heat"', on: c.mode==="heat" },
        { label: "Cool", action: "hvac-mode", extra: 'data-mode="cool"', on: c.mode==="cool" },
        { label: "Off", action: "hvac-mode", extra: 'data-mode="off"', on: c.mode==="off" }
      ]) +
      '</div>';
  }

  function viewAlarm() {
    return backBtn("more") +
      '<div class="heading">Honeywell Lyric</div>' +
      '<div class="card alarm-card">' +
        '<div class="s" style="color:var(--muted);font-size:12px">Status</div>' +
        '<div class="big-status">' + alarmLabel() + '</div>' +
        '<p class="safe">Status only. This demo never shows alarm codes or passwords, and it does not arm or disarm the live panel. The Goodnight and Away scenes only change this preview.</p>' +
      '</div>';
  }

  function viewCameras() {
    return backBtn("more") +
      '<div class="heading">Cameras</div>' +
      '<p class="kicker">Two Hikvision cameras on the house network. Placeholder tiles only — no live or recorded video in this preview.</p>' +
      '<div class="grid2 two">' +
        '<div class="card"><div class="cam"><div class="big">📷</div><div class="t">Camera 1</div><div>Hikvision · preview placeholder</div></div></div>' +
        '<div class="card"><div class="cam"><div class="big">📷</div><div class="t">Camera 2</div><div>Hikvision · preview placeholder</div></div></div>' +
      '</div>';
  }

  function viewDoor() {
    return backBtn("more") +
      '<div class="heading">Front door</div>' +
      '<div class="card"><div class="row"><div class="sw">🔔</div><div class="meta"><div class="n">Ring doorbell</div><div class="s">Idle (demo)</div></div></div></div>' +
      '<div class="card"><div class="row"><div class="sw">🔔</div><div class="meta"><div class="n">Ring chimes</div><div class="s">2 chimes · Online (demo)</div></div></div></div>' +
      '<p class="note">No live video or event history in this preview.</p>';
  }

  function viewBrilliant() {
    return backBtn("more") +
      '<div class="heading">Brilliant panels</div>' +
      '<p class="kicker">3 wall panels. There is no official Home Assistant integration and no local API.</p>' +
      '<div class="card">' +
        '<div class="n" style="font-weight:600;margin-bottom:6px">Alexa bridge (one-way)</div>' +
        '<div class="s" style="color:var(--muted);font-size:13px;line-height:1.45">HA can send a typed Alexa command such as “turn on kitchen lights,” and Alexa passes it to Brilliant. HA cannot see whether a Brilliant load is on or off. There is a 1–3 second cloud delay, and the Alexa login has to be renewed from time to time.</div>' +
        chipRow([
          { label: "Kitchen lights on (demo)", action: "brilliant-cmd", extra: 'data-cmd="Kitchen lights on"' },
          { label: "All off (demo)", action: "brilliant-cmd", extra: 'data-cmd="All off"' }
        ]) +
        '<p class="tiny">These buttons only toast a simulated Alexa command. They do not talk to the panels.</p>' +
      '</div>' +
      '<p class="note">Lutron HomeWorks QS lighting on this dashboard is the reliable path. The panels can stay on the wall as local controls.</p>';
  }

  function viewNetwork() {
    return backBtn("more") +
      '<div class="heading">UniFi network</div>' +
      '<p class="kicker">Status only. No IP addresses or credentials are shown.</p>' +
      '<div class="card">' + NETWORK.map(function (d) {
        return '<div class="sys-row"><div class="sys-dot' + (d.ok?"":" off") + '"></div><div><div class="n">' + esc(d.name) + '</div><div class="s">' + esc(d.note) + ' · Online (demo)</div></div></div>';
      }).join("") + '</div>' +
      '<p class="note">SSID is the house wireless. Access points: five U7 Pro plus one U7 Outdoor.</p>';
  }

  function viewAvs() {
    return backBtn("more") +
      '<div class="heading">TVs &amp; sources</div>' +
      '<p class="kicker">10 Apple TV 4Ks, 6 LG TVs, and a Roku on the house network. Named rooms below are the ones clearly labeled.</p>' +
      TVS.map(tvCard).join("") +
      '<div class="card"><div class="row"><div class="sw">📺</div><div class="meta"><div class="n">Roku</div><div class="s">On the network · not assigned to a room tile</div></div></div></div>' +
      '<p class="note">Remaining Apple TVs and LG sets would appear here once rooms are labeled in the final HA install. URC MRX and Elan TRC-1480 stay as control processors, not extra remotes on this screen.</p>';
  }

  function viewBeds() {
    return backBtn("more") +
      '<div class="heading">FreshBed</div>' +
      '<div class="card"><div class="row"><div class="sw">🛌</div><div class="meta"><div class="n">Master FreshBed</div><div class="s">' + (state.beds.master === "sleep" ? "Sleep mode (demo)" : "Awake (demo)") + '</div></div></div></div>' +
      '<div class="card"><div class="row"><div class="sw">🛌</div><div class="meta"><div class="n">Second FreshBed</div><div class="s">' + (state.beds.guest === "sleep" ? "Sleep mode (demo)" : "Awake (demo)") + '</div></div></div></div>' +
      '<p class="note">Two FreshBed bases are on the network. Room assignment for the second bed can be confirmed at install.</p>';
  }

  const VIEWS = {
    home: viewHome,
    more: viewMore,
    "all-lights": viewAllLights,
    "all-shades": viewAllShades,
    "all-music": viewAllMusic,
    "area-great": function () { return viewArea("great"); },
    "area-master": function () { return viewArea("master"); },
    "area-bar": function () { return viewArea("bar"); },
    "area-matthew": function () { return viewArea("matthew"); },
    "area-outdoor": function () { return viewArea("outdoor"); },
    climate: viewClimate,
    alarm: viewAlarm,
    cameras: viewCameras,
    door: viewDoor,
    brilliant: viewBrilliant,
    network: viewNetwork,
    avs: viewAvs,
    beds: viewBeds
  };

  function currentView() {
    const h = (location.hash || "#home").replace(/^#/, "");
    return VIEWS[h] ? h : "home";
  }

  const TITLES = {
    home: "Home", more: "More", "all-lights": "All Lights", "all-shades": "All Shades",
    "all-music": "All Music", "area-great": "Great Room & Kitchen", "area-master": "Master Suite",
    "area-bar": "Lower Level & Bar", "area-matthew": "Matthew", "area-outdoor": "Outdoor",
    climate: "Aprilaire", alarm: "Alarm", cameras: "Cameras", door: "Front door",
    brilliant: "Brilliant", network: "Network", avs: "TVs", beds: "FreshBed"
  };

  function render(opts) {
    opts = opts || {};
    const app = document.getElementById("app");
    const view = currentView();
    app.innerHTML = VIEWS[view]();
    app.className = "app view-enter";
    if (opts.flash) {
      app.classList.add("scene-flash");
      setTimeout(function () { app.classList.remove("scene-flash"); }, 600);
    }
    document.title = "Firmus Electronics – Diaz Residence" + (view !== "home" ? " · " + TITLES[view] : "");
  }

  function bump(msg) { state.lastScene = null; save(); if (msg) toast(msg); render(); }

  function onAction(action, el) {
    const ds = el.dataset || {};
    switch (action) {
      case "nav":
        location.hash = ds.view || "home";
        return;
      case "scene":
        applyScene(ds.scene);
        return;
      case "toggle-light": {
        const L = state.lights[ds.id];
        L.on = !L.on;
        if (L.on && !L.bri) L.bri = 80;
        bump(); return;
      }
      case "lights-preset":
        setLightsAll(+ds.bri, ds.area || null);
        bump(+ds.bri ? "Lights set (demo)" : "All lights off (demo)");
        return;
      case "shade-set":
        state.shades[ds.id] = +ds.pos;
        bump(); return;
      case "shades-preset":
        setShadesAll(+ds.pos, ds.area || null);
        bump("Shades set (demo)");
        return;
      case "toggle-zone":
        state.zones[ds.id].playing = !state.zones[ds.id].playing;
        bump(); return;
      case "music-pause":
        stopMusic(ds.area || null);
        bump("Music paused (demo)");
        return;
      case "music-kitchen":
        state.zones.kitchen.playing = true;
        bump("Kitchen playing (demo)");
        return;
      case "toggle-yamaha":
        state.yamaha.playing = !state.yamaha.playing;
        bump(); return;
      case "toggle-tv":
        state.tvs[ds.id].on = !state.tvs[ds.id].on;
        bump(); return;
      case "set-temp": {
        state.climate.set = Math.max(60, Math.min(80, state.climate.set + (+ds.delta)));
        bump(); return;
      }
      case "hvac-mode":
        state.climate.mode = ds.mode;
        bump(); return;
      case "brilliant-cmd":
        toast("Alexa (demo): “" + ds.cmd + "” — not sent to the house");
        return;
    }
  }

  function onInput(el) {
    const ds = el.dataset || {};
    const v = +el.value;
    const pct = el.parentNode && el.parentNode.querySelector(".pct");
    if (pct) pct.textContent = v + "%";
    if (ds.action === "bri") {
      setLight(ds.id, v);
      state.lastScene = null; save();
    } else if (ds.action === "shade") {
      state.shades[ds.id] = v;
      state.lastScene = null; save();
      const lab = el.closest(".card") && el.closest(".card").querySelector(".pos-label");
      if (lab) lab.textContent = shadeWord(v);
    } else if (ds.action === "zone-vol") {
      state.zones[ds.id].vol = v;
      state.lastScene = null; save();
    } else if (ds.action === "yamaha-vol") {
      state.yamaha.vol = v;
      state.lastScene = null; save();
    }
  }

  const app = document.getElementById("app");
  app.addEventListener("click", function (ev) {
    const el = ev.target.closest("[data-action]");
    if (!el) return;
    if (el.tagName === "INPUT") return;
    onAction(el.dataset.action, el, ev);
  });
  app.addEventListener("input", function (ev) {
    if (ev.target && ev.target.dataset && ev.target.dataset.action) onInput(ev.target);
  });
  app.addEventListener("change", function (ev) {
    if (ev.target && ev.target.dataset && ev.target.dataset.action) render();
  });
  document.getElementById("reset-link").addEventListener("click", resetDemo);
  window.addEventListener("hashchange", function () { render(); });

  window.__diazDemo = { getState: function(){ return state; }, applyScene: applyScene, reset: resetDemo, defaults: defaults };

  function autotest() {
    document.body.classList.add("autotest");
    const errors = [];
    window.addEventListener("error", function (e) { errors.push(String(e.message || e)); });
    const results = [];
    function assert(cond, name) { results.push({ name: name, ok: !!cond }); if (!cond) errors.push("FAIL " + name); }
    try {
      localStorage.removeItem(STORE);
      state = defaults();
      applyScene("morning");
      assert(state.lights["kit-recessed"].bri === 70 && state.lights["kit-recessed"].on, "morning kitchen 70");
      assert(state.shades["gr-left"] === 100, "morning shades open");
      assert(state.zones.kitchen.playing, "morning kitchen music");
      assert(state.alarm === "disarmed", "morning disarmed");
      applyScene("movie");
      assert(state.shades["gr-left"] === 0 && state.tvs["tv-great"].on, "movie shades + TV");
      assert(state.lights["gr-lamps"].bri === 15, "movie lamps 15");
      applyScene("dinner");
      assert(state.lights["kit-pendants"].bri === 65 && state.shades["kit-win"] === 50, "dinner levels");
      applyScene("goodnight");
      assert(state.lights["kit-recessed"].on === false && state.shades["mbr-win"] === 0, "goodnight off + closed");
      assert(state.alarm === "stay" && state.climate.set === 66, "goodnight stay + setback");
      applyScene("away");
      assert(state.alarm === "away" && !state.tvs["tv-great"].on, "away armed, TVs off");
      assert(lightsOnCount() === 0 && shadeAvg() === 0, "away dark and closed");
      const appText = document.getElementById("app").innerText || "";
      const appHtml = document.getElementById("app").innerHTML || "";
      const lanHint = "192" + ".168";
      assert(!appHtml.includes(lanHint) && !appText.includes(lanHint), "no LAN IPs in app");
      assert(!/\b(?:\d{1,3}\.){3}\d{1,3}\b/.test(appText), "no dotted IPs in app text");
      assert(!/\bPIN\b\s*[:#]?\s*\d/.test(appText), "no PIN codes");
    } catch (e) { errors.push(String(e && e.stack || e)); }
    const out = document.getElementById("autotest-out");
    const failed = results.filter(function (r) { return !r.ok; });
    out.textContent = (failed.length ? "FAIL " + failed.length : "PASS") + "\n" +
      results.map(function (r) { return (r.ok ? "ok  " : "BAD ") + r.name; }).join("\n") +
      (errors.length ? "\n" + errors.join("\n") : "");
    console.log(out.textContent);
  }
  if (/[?&]autotest=1/.test(location.search)) setTimeout(autotest, 0);

  render();
})();

</script>
</body>
</html>
